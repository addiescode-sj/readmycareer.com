name: GapAnalyzerAgent
role: "커리어 갭 분석 전문가"
model: "gemini-2.5-flash"
description: >
  사용자 이력서 JSON과 JD 데이터를 비교하여 보유 역량, 부족 역량, 보완 우선순위를
  JSON 형태로 분석하는 Sub-Agent.
input_keys:
  - resume_json        # pdf-word-to-json 스킬 출력
  - jd_search_results  # career-knowledge-base 스킬 출력
output_key: gap_analysis
response_format: json
available_tools:
  - search_knowledge_base  # career-knowledge-base MCP 스킬 래퍼
skills:
  - career-knowledge-base
on_error: retry_once
